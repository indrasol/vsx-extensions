version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused for October (was 10); 0 stops version updates, security updates still open
    # Majors of these are held back on purpose and upgraded by hand. @types/node must match the
    # oldest supported Node (the floor is 22.12, raised for @vscode/test-electron 3, so Vitest
    # majors are allowed). typescript-eslint supports TypeScript < 6.1. Minor and patch bumps stay
    # grouped below.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused for October (was the default, 5); security updates still open
    groups:
      github-actions:
        patterns: ['*']
